spring:
  application:
    name: DeliveryApplication

  datasource:
    url: jdbc:postgresql://localhost:5432/delivery
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret:
    key:${JWT_SECRET_KEY}